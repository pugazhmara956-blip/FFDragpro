name: Build FF DRAG PRO APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the project from the part files
        shell: bash
        run: |
          set -euo pipefail
          echo "Files in the repository:"
          git ls-files
          # Find every file holding FF DRAG PRO code, whatever its name or folder.
          grep -rlI --exclude-dir=.git --exclude-dir=.github "FFDRAG_EOF" . > /tmp/found.txt || true
          : > /tmp/ordered.txt
          while IFS= read -r f; do
            n=$(grep -m1 -oE 'part [0-9]+ of 7' "$f" | grep -oE '[0-9]+' | head -n1 || true)
            echo "${n:-99} $f" >> /tmp/ordered.txt
          done < /tmp/found.txt
          sort -n /tmp/ordered.txt -o /tmp/ordered.txt
          echo "Part files found:"
          cat /tmp/ordered.txt
          count=$(wc -l < /tmp/ordered.txt)
          if [ "$count" -lt 7 ]; then
            echo "::error::Found $count part files, expected 7. Check the list above."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/FFDragPro"
          cd "$RUNNER_TEMP/FFDragPro"
          while read -r n f; do
            echo "Running part $n: $f"
            bash "$GITHUB_WORKSPACE/${f#./}"
          done < /tmp/ordered.txt
          echo "Created $(find . -type f | wc -l) files"
          mv "$RUNNER_TEMP/FFDragPro" "$GITHUB_WORKSPACE/FFDragPro"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests and build APKs
        working-directory: FFDragPro
        run: gradle --no-daemon testDebugUnitTest assembleDebug assembleRelease

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: FF-DRAG-PRO-apk
          path: |
            FFDragPro/app/build/outputs/apk/debug/*.apk
            FFDragPro/app/build/outputs/apk/release/*.apk
